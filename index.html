<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
<meta name="theme-color" content="#16A34A" />
<meta name="description" content="4D Mart — Katalog produk warung. Pesan mudah via WhatsApp." />

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%2316A34A'/%3E%3Cstop offset='100%25' stop-color='%23FACC15'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='112' fill='url(%23g)'/%3E%3Cpath fill='%23fff' transform='translate(96 96) scale(13.33)' d='M7 7V6a5 5 0 0 1 10 0v1h2.5A1.5 1.5 0 0 1 21 8.5v11A2.5 2.5 0 0 1 18.5 22h-13A2.5 2.5 0 0 1 3 19.5v-11A1.5 1.5 0 0 1 4.5 7H7zm2 0h6V6a3 3 0 1 0-6 0v1z'/%3E%3C/svg%3E" />

<title>4D Mart — Katalog Produk</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green-50:#F0FDF4;--green-100:#DCFCE7;--green-500:#22C55E;--green-600:#16A34A;--green-700:#15803D;
  --yellow-100:#FEF9C3;--yellow-300:#FDE047;--yellow-400:#FACC15;--yellow-500:#EAB308;
  --white:#fff;--gray-50:#F9FAFB;--gray-100:#F3F4F6;--gray-200:#E5E7EB;--gray-300:#D1D5DB;
  --gray-400:#9CA3AF;--gray-500:#6B7280;--gray-600:#4B5563;--gray-700:#374151;--gray-900:#111827;
  --primary:var(--green-600);--primary-dark:var(--green-700);--primary-soft:var(--green-50);
  --accent:var(--yellow-400);--danger:#EF4444;--danger-soft:#FEF2F2;
  --bg:var(--gray-50);--surface:var(--white);--border:var(--gray-200);
  --text:var(--gray-900);--text-2:var(--gray-600);--text-3:var(--gray-400);
  --grad-primary:linear-gradient(135deg,#16A34A 0%,#22C55E 50%,#FACC15 100%);
  --grad-soft:linear-gradient(135deg,#F0FDF4 0%,#FEFCE8 100%);
  --grad-dark:linear-gradient(135deg,#111827 0%,#374151 100%);
  --r-sm:10px;--r:14px;--r-lg:18px;--r-xl:24px;--r-full:999px;
  --shadow-xs:0 1px 2px rgba(17,24,39,.04);
  --shadow-sm:0 2px 6px rgba(17,24,39,.06);
  --shadow-md:0 4px 14px rgba(17,24,39,.08);
  --shadow-lg:0 12px 32px rgba(17,24,39,.14);
  --shadow-green:0 8px 24px rgba(22,163,74,.28);
  --appbar-h:64px;--bottomnav-h:68px;--max-w:1200px;
}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;
  padding-bottom:calc(var(--bottomnav-h) + env(safe-area-inset-bottom,0px) + 8px);
  overflow-x:hidden;
}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
input{font-family:inherit}
[hidden]{display:none !important}

/* APPBAR */
.appbar{position:sticky;top:0;z-index:90;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s;display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:var(--appbar-h)}
.appbar--scrolled{border-bottom-color:var(--border);box-shadow:var(--shadow-xs)}
.appbar__brand{display:flex;align-items:center;gap:12px}
.appbar__logo{width:42px;height:42px;border-radius:14px;background:var(--grad-primary);color:#fff;display:grid;place-items:center;font-size:1.05rem;box-shadow:var(--shadow-green)}
.appbar__text{display:flex;flex-direction:column;line-height:1.15}
.appbar__name{font-size:1.02rem;font-weight:800;letter-spacing:-.02em;color:var(--gray-900)}
.appbar__tag{font-size:.68rem;color:var(--text-3);font-weight:600}
.appbar__action{position:relative;width:44px;height:44px;border-radius:14px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-size:1.1rem;transition:transform .15s,background .15s}
.appbar__action:active{transform:scale(.92);background:var(--green-100)}
.appbar__badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:var(--r-full);background:var(--accent);color:var(--gray-900);font-size:.68rem;font-weight:800;display:grid;place-items:center;border:2px solid #fff}

/* SEARCH */
.searchbar{position:sticky;top:var(--appbar-h);z-index:85;background:var(--bg);padding:10px 16px 12px}
.searchbar__inner{position:relative;max-width:var(--max-w);margin:0 auto}
.searchbar__icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none;font-size:.9rem}
.searchbar__input{width:100%;padding:13px 44px 13px 42px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--surface);font-size:.92rem;color:var(--text);transition:border-color .15s,box-shadow .15s}
.searchbar__input::placeholder{color:var(--text-3)}
.searchbar__input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(22,163,74,.12)}
.searchbar__clear{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:1rem;padding:4px;border-radius:50%}

/* AD */
.adbar{max-width:var(--max-w);margin:0 auto;padding:0 16px 12px}
.adbar__inner{background:var(--grad-dark);border-radius:var(--r);padding:12px 16px;display:flex;align-items:center;gap:12px;color:#fff;overflow:hidden;position:relative;box-shadow:var(--shadow-sm)}
.adbar__inner::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 88% 50%,rgba(250,204,21,.22),transparent 65%);pointer-events:none}
.adbar__inner::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 8% 50%,rgba(22,163,74,.28),transparent 60%);pointer-events:none}
.adbar__pill{background:var(--accent);color:var(--gray-900);padding:4px 10px;border-radius:var(--r-full);font-size:.66rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;position:relative;display:inline-flex;align-items:center;gap:4px}
.adbar__text{font-size:.82rem;font-weight:600;position:relative;z-index:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* CHIPS */
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 16px;scrollbar-width:none;-ms-overflow-style:none;max-width:var(--max-w);margin:0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--r-full);border:1.5px solid var(--border);background:var(--surface);color:var(--text-2);font-size:.82rem;font-weight:700;white-space:nowrap;transition:all .15s}
.chip:active{transform:scale(.96)}
.chip i{font-size:.78rem}
.chip--active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:var(--shadow-green)}

/* CONTENT */
.content{max-width:var(--max-w);margin:0 auto;padding:0 16px 24px}
.content__head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.content__title{font-size:1rem;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.content__title i{color:var(--primary);font-size:.9rem}
.content__count{font-size:.78rem;color:var(--text-3);font-weight:600}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}}
@media(min-width:1440px){.grid{grid-template-columns:repeat(5,1fr)}}

/* CARD */
.card{position:relative;background:var(--surface);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;cursor:pointer;transition:transform .18s,box-shadow .18s;animation:cardIn .35s cubic-bezier(.16,1,.3,1) backwards}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card:active{transform:scale(.97)}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}.card:hover .card__img img{transform:scale(1.06)}}
.card__img{position:relative;aspect-ratio:1/1;background:var(--gray-100);overflow:hidden}
.card__img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card__ribbon{position:absolute;top:8px;left:8px;padding:4px 10px;border-radius:var(--r-full);font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;display:inline-flex;align-items:center;gap:4px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.card__ribbon i{font-size:.6rem}
.card__ribbon--out{background:var(--danger);color:#fff}
.card__body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card__name{font-size:.85rem;font-weight:700;line-height:1.3;color:var(--gray-900);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.2em}
.card__price{font-size:1rem;font-weight:800;color:var(--primary);letter-spacing:-.02em}
.card__status{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:var(--r-full);width:fit-content;margin-top:2px}
.card__status i{font-size:.55rem}
.card__status--ok{background:var(--green-50);color:var(--primary-dark)}
.card__status--out{background:var(--danger-soft);color:var(--danger)}
.card__btn{margin-top:10px;padding:8px 0;border-radius:var(--r-sm);background:var(--primary-soft);color:var(--primary);font-size:.76rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.card__btn i{font-size:.72rem}
.card__btn:hover:not(:disabled){background:var(--primary);color:#fff}
.card__btn:disabled{background:var(--gray-100);color:var(--text-3);cursor:not-allowed}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--text-3)}
.empty__icon{width:72px;height:72px;margin:0 auto 16px;border-radius:24px;background:var(--grad-soft);display:grid;place-items:center;font-size:1.6rem;color:var(--primary)}
.empty__text{font-weight:700;font-size:.95rem;color:var(--text-2)}
.empty__hint{font-size:.78rem;margin-top:4px}

/* SKELETON */
.skeleton{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-sm)}
.skeleton__img{aspect-ratio:1/1;background:linear-gradient(90deg,var(--gray-100) 25%,var(--gray-200) 50%,var(--gray-100) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
.skeleton__body{padding:12px;display:flex;flex-direction:column;gap:8px}
.skeleton__line{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--gray-100) 25%,var(--gray-200) 50%,var(--gray-100) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
.skeleton__line--short{width:60%}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* BOTTOM NAV */
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:95;height:calc(var(--bottomnav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(255,255,255,.97);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr)}
@media(min-width:1024px){.bottomnav{max-width:560px;left:50%;right:auto;transform:translateX(-50%);border-radius:var(--r-xl) var(--r-xl) 0 0;border:1px solid var(--border);border-bottom:none;box-shadow:0 -4px 20px rgba(17,24,39,.06)}}
.nav-item{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-3);font-size:.66rem;font-weight:700;transition:color .15s}
.nav-item i{font-size:1.05rem;transition:transform .2s}
.nav-item--active{color:var(--primary)}
.nav-item--active i{transform:scale(1.08)}
.nav-item:active i{transform:scale(.9)}
.nav-item__badge{position:absolute;top:6px;left:50%;transform:translateX(4px);min-width:16px;height:16px;padding:0 4px;border-radius:var(--r-full);background:var(--accent);color:var(--gray-900);font-size:.6rem;font-weight:800;display:grid;place-items:center;border:2px solid #fff}

/* MODAL */
.modal{position:fixed;inset:0;z-index:200;display:grid;place-items:end center}
@media(min-width:640px){.modal{place-items:center;padding:20px}}
.modal__backdrop{position:absolute;inset:0;background:rgba(17,24,39,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal__panel{position:relative;background:var(--surface);width:100%;max-width:520px;max-height:92vh;border-radius:var(--r-xl) var(--r-xl) 0 0;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slideUp .32s cubic-bezier(.16,1,.3,1)}
@media(min-width:640px){.modal__panel{border-radius:var(--r-xl)}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal__close{position:absolute;top:12px;right:12px;z-index:5;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);color:var(--gray-900);font-size:1.05rem;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}

/* PRODUCT DETAIL */
.pd__gallery{position:relative;aspect-ratio:1/1;background:var(--gray-100);overflow:hidden}
.pd__track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.pd__track::-webkit-scrollbar{display:none}
.pd__slide{flex:0 0 100%;scroll-snap-align:start;height:100%}
.pd__slide img{width:100%;height:100%;object-fit:cover}
.pd__dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:rgba(17,24,39,.45);padding:5px 9px;border-radius:var(--r-full)}
.pd__dot{width:6px;height:6px;border-radius:var(--r-full);background:rgba(255,255,255,.5);transition:all .2s}
.pd__dot--active{background:var(--accent);width:18px}
.pd__body{padding:22px}
.pd__name{font-size:1.25rem;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin-bottom:6px}
.pd__price{font-size:1.5rem;font-weight:800;color:var(--primary);letter-spacing:-.03em;margin-bottom:18px}
.pd__stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;background:var(--grad-soft);border-radius:var(--r);margin-bottom:18px}
.pd__stat{display:flex;flex-direction:column;gap:4px}
.pd__stat-label{font-size:.66rem;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.pd__stat-value{font-size:.88rem;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.pd__stat-value--ok{color:var(--primary-dark)}
.pd__stat-value--out{color:var(--danger)}
.pd__stat-value i{font-size:.75rem}
.pd__section-title{font-size:.72rem;font-weight:800;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.pd__desc{font-size:.88rem;color:var(--text-2);line-height:1.7;margin-bottom:22px;white-space:pre-wrap}
.pd__actions{display:flex;gap:10px}
.pd__actions .btn{flex:1}

/* DRAWER */
.drawer{position:fixed;inset:0;z-index:300}
.drawer__backdrop{position:absolute;inset:0;background:rgba(17,24,39,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeIn .2s}
.drawer__panel{position:absolute;right:0;top:0;bottom:0;width:100%;max-width:420px;background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:slideRight .32s cubic-bezier(.16,1,.3,1)}
@keyframes slideRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
.drawer__head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}
.drawer__title{font-size:1.05rem;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.drawer__title i{color:var(--primary)}
.drawer__close{width:38px;height:38px;border-radius:50%;color:var(--text-2);font-size:1.05rem;display:grid;place-items:center}
.drawer__close:active{background:var(--gray-100)}
.drawer__body{flex:1;overflow-y:auto;padding:4px 20px}
.drawer__foot{padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);background:var(--surface)}
.drawer__total{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.drawer__total span{font-size:.85rem;color:var(--text-2);font-weight:600}
.drawer__total strong{font-size:1.25rem;font-weight:800;color:var(--primary);letter-spacing:-.03em}

/* CART ITEM */
.ci{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
.ci:last-child{border-bottom:none}
.ci__img{width:68px;height:68px;border-radius:var(--r-sm);overflow:hidden;background:var(--gray-100);flex-shrink:0}
.ci__img img{width:100%;height:100%;object-fit:cover}
.ci__info{flex:1;min-width:0;display:flex;flex-direction:column}
.ci__name{font-size:.86rem;font-weight:700;line-height:1.3;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ci__price{font-size:.82rem;font-weight:800;color:var(--primary);margin-bottom:8px}
.ci__ctrls{display:flex;align-items:center;gap:8px;margin-top:auto}
.ci__qty-btn{width:30px;height:30px;border-radius:var(--r-sm);border:1.5px solid var(--border);color:var(--gray-900);font-size:.9rem;display:grid;place-items:center;transition:all .15s}
.ci__qty-btn:active{transform:scale(.9)}
.ci__qty-btn:hover{border-color:var(--primary);color:var(--primary)}
.ci__qty{font-size:.85rem;font-weight:800;min-width:22px;text-align:center}
.ci__remove{margin-left:auto;padding:5px 10px;border-radius:var(--r-sm);font-size:.7rem;font-weight:700;color:var(--text-3);transition:all .15s}
.ci__remove:hover{background:var(--danger-soft);color:var(--danger)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:var(--r);font-size:.88rem;font-weight:800;font-family:inherit;white-space:nowrap;transition:transform .15s,background .15s,box-shadow .15s}
.btn i{font-size:.9rem}
.btn:active{transform:scale(.97)}
.btn--primary{background:var(--primary);color:#fff;box-shadow:var(--shadow-green)}
.btn--primary:hover{background:var(--primary-dark)}
.btn--primary:disabled{background:var(--gray-300);box-shadow:none;cursor:not-allowed}
.btn--wa{background:#25D366;color:#fff;box-shadow:0 8px 24px rgba(37,211,102,.32)}
.btn--wa:hover{background:#1EA855}
.btn--full{width:100%}

/* CART EMPTY */
.cart-empty{text-align:center;padding:80px 20px;color:var(--text-3)}
.cart-empty__icon{width:80px;height:80px;border-radius:26px;background:var(--grad-soft);color:var(--primary);font-size:2rem;display:grid;place-items:center;margin:0 auto 16px}
.cart-empty__text{font-size:.92rem;font-weight:700;color:var(--text-2)}
.cart-empty__hint{font-size:.78rem;margin-top:4px}

/* TOAST */
.toast{position:fixed;bottom:calc(var(--bottomnav-h) + env(safe-area-inset-bottom,0px) + 16px);left:50%;transform:translateX(-50%);background:var(--gray-900);color:#fff;padding:12px 20px;border-radius:var(--r-full);font-size:.82rem;font-weight:700;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow-lg);z-index:400;animation:toastIn .32s cubic-bezier(.16,1,.3,1);max-width:calc(100vw - 32px)}
.toast i{color:var(--accent);font-size:.9rem}
.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* IMG FALLBACK */
.img-fallback{display:grid;place-items:center;background:var(--gray-100);color:var(--text-3);font-size:1.5rem;width:100%;height:100%}
</style>
</head>
<body>

<header class="appbar" id="appbar">
  <div class="appbar__brand">
    <div class="appbar__logo"><i class="fas fa-bag-shopping"></i></div>
    <div class="appbar__text">
      <span class="appbar__name">4D Mart</span>
      <span class="appbar__tag">Warung Serba Ada</span>
    </div>
  </div>
  <button class="appbar__action" id="cartBtn" aria-label="Keranjang">
    <i class="fas fa-bag-shopping"></i>
    <span class="appbar__badge" id="cartBadge" hidden>0</span>
  </button>
</header>

<div class="searchbar">
  <div class="searchbar__inner">
    <i class="fas fa-magnifying-glass searchbar__icon"></i>
    <input type="search" id="searchInput" class="searchbar__input" placeholder="Cari produk di 4D Mart..." autocomplete="off" />
    <button class="searchbar__clear" id="searchClear" hidden aria-label="Bersihkan">
      <i class="fas fa-circle-xmark"></i>
    </button>
  </div>
</div>

<div class="adbar">
  <div class="adbar__inner">
    <span class="adbar__pill"><i class="fas fa-bolt"></i> Promo</span>
    <p class="adbar__text">Gratis ongkir untuk pembelian di atas Rp50.000!</p>
  </div>
</div>

<div class="chips" id="chips"></div>

<main class="content">
  <div class="content__head">
    <h2 class="content__title"><i class="fas fa-store"></i> Produk</h2>
    <span class="content__count" id="countText">0 produk</span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <div class="empty__icon"><i class="fas fa-magnifying-glass"></i></div>
    <p class="empty__text">Produk tidak ditemukan</p>
    <p class="empty__hint">Coba kata kunci lain atau ubah kategori</p>
  </div>
</main>

<nav class="bottomnav">
  <button class="nav-item nav-item--active" data-nav="home">
    <i class="fas fa-house"></i><span>Beranda</span>
  </button>
  <button class="nav-item" data-nav="category">
    <i class="fas fa-layer-group"></i><span>Kategori</span>
  </button>
  <button class="nav-item" data-nav="cart" id="navCart">
    <i class="fas fa-bag-shopping"></i><span>Keranjang</span>
    <span class="nav-item__badge" id="navBadge" hidden>0</span>
  </button>
  <button class="nav-item" data-nav="wa">
    <i class="fab fa-whatsapp"></i><span>Chat</span>
  </button>
</nav>

<div class="modal" id="modal" hidden>
  <div class="modal__backdrop" data-close></div>
  <div class="modal__panel" role="dialog" aria-modal="true">
    <button class="modal__close" data-close aria-label="Tutup"><i class="fas fa-xmark"></i></button>
    <div id="modalContent"></div>
  </div>
</div>

<aside class="drawer" id="drawer" hidden>
  <div class="drawer__backdrop" data-close></div>
  <div class="drawer__panel" role="dialog" aria-modal="true">
    <div class="drawer__head">
      <div class="drawer__title"><i class="fas fa-bag-shopping"></i> Keranjang</div>
      <button class="drawer__close" data-close aria-label="Tutup"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="drawer__body" id="cartBody"></div>
    <div class="drawer__foot" id="cartFoot" hidden>
      <div class="drawer__total">
        <span>Total</span>
        <strong id="cartTotal">Rp0</strong>
      </div>
      <button class="btn btn--wa btn--full" id="checkoutBtn">
        <i class="fab fa-whatsapp"></i> Pesan via WhatsApp
      </button>
    </div>
  </div>
</aside>

<div class="toast" id="toast" hidden>
  <i class="fas fa-circle-check"></i><span id="toastMsg"></span>
</div>

<script>
/* ============================================================
   4D MART — Catalog App v0.2.0
   ============================================================ */

/* ============ KONFIGURASI ============ */
const CONFIG = {
  // ⚙️ GANTI INI:
  SHEET_ID: '1wQn5TNnUWq7zHA-69pw1i3svSk_3qOL_cOCLvMe4NMY',  // Kosongkan = pakai data contoh. Isi = ambil dari Google Sheet
  SHEET_NAME: 'Products',
  WA_NUMBER: '6285863710179',                               // Nomor WA penjual, format 62xxx
  STORE_NAME: '4D Mart',
};

/* ============ FALLBACK DATA ============ */
const FALLBACK_PRODUCTS = [
  {id:'p-001',name:'Indomie Goreng Original',price:3500,stock:48,category:'Makanan',description:'Mie instan legendaris. Praktis, gurih, cocok kapan saja.',images:['https://picsum.photos/seed/indomie/600/600'],link:''},
  {id:'p-002',name:'Kopi Kapal Api Special 165g',price:12500,stock:24,category:'Minuman',description:'Kopi bubuk Kapal Api Special. Aroma kuat, rasa mantap.',images:['https://picsum.photos/seed/kopi1/600/600','https://picsum.photos/seed/kopi2/600/600'],link:''},
  {id:'p-003',name:'Teh Pucuk Harum 350ml',price:4000,stock:60,category:'Minuman',description:'Teh melati segar dalam kemasan botol. Dingin lebih nikmat.',images:['https://picsum.photos/seed/teh/600/600'],link:''},
  {id:'p-004',name:'Beras Premium 5kg',price:68000,stock:0,category:'Sembako',description:'Beras premium pulen dan wangi. Kemasan 5 kilogram.',images:['https://picsum.photos/seed/beras/600/600'],link:''},
  {id:'p-005',name:'Sabun Lifebuoy Cair 450ml',price:28500,stock:12,category:'Perawatan',description:'Sabun cair antibakteri. Melindungi dari kuman dan bakteri.',images:['https://picsum.photos/seed/sabun/600/600'],link:''},
  {id:'p-006',name:'Roti Tawar Sari Roti',price:16000,stock:8,category:'Makanan',description:'Roti tawar lembut dan fresh. Cocok untuk sarapan.',images:['https://picsum.photos/seed/roti/600/600'],link:''},
  {id:'p-007',name:'Telur Ayam Negeri 1kg',price:32000,stock:15,category:'Sembako',description:'Telur ayam negeri segar. Kemasan 1 kilogram.',images:['https://picsum.photos/seed/telur/600/600'],link:''},
  {id:'p-008',name:'Aqua Air Mineral 600ml',price:3500,stock:96,category:'Minuman',description:'Air mineral dalam kemasan botol 600ml.',images:['https://picsum.photos/seed/aqua/600/600'],link:''},
];

/* ============ STATE ============ */
const state = {
  products: [],
  cart: loadCart(),
  category: 'Semua',
  query: '',
};

/* ============ HELPERS ============ */
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

const formatRp = (n) => new Intl.NumberFormat('id-ID',{
  style:'currency',currency:'IDR',minimumFractionDigits:0,maximumFractionDigits:0
}).format(n);

function showToast(msg, ms = 2200) {
  const t = $('#toast');
  $('#toastMsg').textContent = msg;
  t.hidden = false;
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { t.hidden = true; }, ms);
}

function loadCart() {
  try { return JSON.parse(localStorage.getItem('4dmart_cart') || '[]'); }
  catch { return []; }
}
function saveCart() {
  localStorage.setItem('4dmart_cart', JSON.stringify(state.cart));
}

/* Escape HTML untuk keamanan */
function esc(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ============ FETCH PRODUCTS ============ */
async function fetchProducts() {
  if (!CONFIG.SHEET_ID) {
    console.info('[4D Mart] SHEET_ID kosong — pakai data contoh.');
    await new Promise((r) => setTimeout(r, 400)); // simulasi loading
    return FALLBACK_PRODUCTS;
  }
  try {
    const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&sheet=${CONFIG.SHEET_NAME}`;
    const res = await fetch(url);
    const txt = await res.text();
    const match = txt.match(/setResponse\((.*)\)/s);
    if (!match) throw new Error('Format Sheet tidak valid');
    const json = JSON.parse(match[1]);
    const cols = json.table.cols.map((c) => c.label || c.id);

    return json.table.rows.map((row, i) => {
      const o = {};
      cols.forEach((c, j) => { o[c] = row.c[j] ? row.c[j].v : null; });
      const images = [o.image1, o.image2, o.image3].filter(Boolean).slice(0,3);
      return {
        id: String(o.id || `p-${i}`),
        name: o.name || 'Tanpa Nama',
        price: Number(o.price) || 0,
        stock: Number(o.stock) || 0,
        category: o.category || 'Lainnya',
        description: o.description || '',
        images: images.length ? images : [],
        link: o.link || '',
      };
    });
  } catch (err) {
    console.warn('[4D Mart] Gagal ambil dari Sheet, pakai fallback:', err);
    showToast('Gagal memuat dari server, pakai data contoh');
    return FALLBACK_PRODUCTS;
  }
}

/* ============ IMAGE RENDER (dengan fallback) ============ */
function renderImgTag(src, alt, cls = '') {
  if (!src) {
    return `<div class="img-fallback ${cls}"><i class="fas fa-image"></i></div>`;
  }
  const safeSrc = esc(src);
  const safeAlt = esc(alt);
  return `<img src="${safeSrc}" alt="${safeAlt}" loading="lazy" class="${cls}"
    onerror="this.outerHTML='<div class=\\'img-fallback\\'><i class=\\'fas fa-image\\'></i></div>'" />`;
}

/* ============ STOCK STATUS ============ */
function stockStatus(stock) {
  return stock > 0
    ? { label:'Tersedia', cls:'ok', icon:'fa-circle-check' }
    : { label:'Habis',    cls:'out', icon:'fa-circle-xmark' };
}

/* ============ CHIPS ============ */
function renderChips() {
  const cats = ['Semua', ...new Set(state.products.map((p) => p.category))];
  const icons = {
    'Semua':'fa-border-all','Makanan':'fa-utensils','Minuman':'fa-mug-hot',
    'Sembako':'fa-basket-shopping','Perawatan':'fa-soap','Snack':'fa-cookie-bite',
  };
  $('#chips').innerHTML = cats.map((c) => `
    <button class="chip ${c === state.category ? 'chip--active' : ''}" data-cat="${esc(c)}">
      <i class="fas ${icons[c] || 'fa-tag'}"></i>${esc(c)}
    </button>`).join('');
}

/* ============ GRID ============ */
function renderSkeleton() {
  $('#grid').innerHTML = Array.from({length: 6}).map(() => `
    <div class="skeleton">
      <div class="skeleton__img"></div>
      <div class="skeleton__body">
        <div class="skeleton__line"></div>
        <div class="skeleton__line skeleton__line--short"></div>
      </div>
    </div>`).join('');
}

function renderGrid() {
  const list = state.products.filter((p) => {
    const matchCat = state.category === 'Semua' || p.category === state.category;
    const matchQ = !state.query || p.name.toLowerCase().includes(state.query.toLowerCase());
    return matchCat && matchQ;
  });

  $('#countText').textContent = `${list.length} produk`;

  if (!list.length) {
    $('#grid').innerHTML = '';
    $('#empty').hidden = false;
    return;
  }
  $('#empty').hidden = true;

  $('#grid').innerHTML = list.map((p, i) => {
    const s = stockStatus(p.stock);
    const out = p.stock <= 0;
    const ribbon = out ? `<span class="card__ribbon card__ribbon--out"><i class="fas fa-ban"></i>Habis</span>` : '';
    const img = p.images[0] ? renderImgTag(p.images[0], p.name) : `<div class="img-fallback"><i class="fas fa-image"></i></div>`;
    return `
      <article class="card" data-id="${esc(p.id)}" style="animation-delay:${i * 0.03}s">
        <div class="card__img">
          ${img}
          ${ribbon}
        </div>
        <div class="card__body">
          <h3 class="card__name">${esc(p.name)}</h3>
          <p class="card__price">${formatRp(p.price)}</p>
          <span class="card__status card__status--${s.cls}">
            <i class="fas ${s.icon}"></i>${s.label}
          </span>
          <button class="card__btn" data-add="${esc(p.id)}" ${out ? 'disabled' : ''}>
            <i class="fas ${out ? 'fa-ban' : 'fa-cart-plus'}"></i>
            ${out ? 'Stok Habis' : 'Keranjang'}
          </button>
        </div>
      </article>`;
  }).join('');
}

/* ============ MODAL DETAIL ============ */
function openDetail(id) {
  const p = state.products.find((x) => x.id === id);
  if (!p) return;
  const s = stockStatus(p.stock);
  const out = p.stock <= 0;

  const slides = p.images.length
    ? p.images.map((img) => `<div class="pd__slide">${renderImgTag(img, p.name)}</div>`).join('')
    : `<div class="pd__slide"><div class="img-fallback"><i class="fas fa-image"></i></div></div>`;

  const dots = p.images.length > 1
    ? `<div class="pd__dots" id="pdDots">${p.images.map((_, i) =>
        `<span class="pd__dot ${i === 0 ? 'pd__dot--active' : ''}"></span>`).join('')}</div>` : '';

  $('#modalContent').innerHTML = `
    <div class="pd__gallery">
      <div class="pd__track" id="pdTrack">${slides}</div>
      ${dots}
    </div>
    <div class="pd__body">
      <h2 class="pd__name">${esc(p.name)}</h2>
      <p class="pd__price">${formatRp(p.price)}</p>
      <div class="pd__stats">
        <div class="pd__stat">
          <span class="pd__stat-label">Status</span>
          <span class="pd__stat-value pd__stat-value--${s.cls}">
            <i class="fas ${s.icon}"></i>${s.label}
          </span>
        </div>
        <div class="pd__stat">
          <span class="pd__stat-label">Kategori</span>
          <span class="pd__stat-value">${esc(p.category)}</span>
        </div>
      </div>
      <div class="pd__section-title">Deskripsi</div>
      <p class="pd__desc">${esc(p.description) || 'Belum ada deskripsi produk.'}</p>
      <div class="pd__actions">
        <button class="btn btn--primary btn--full" data-add="${esc(p.id)}" ${out ? 'disabled' : ''}>
          <i class="fas ${out ? 'fa-ban' : 'fa-cart-plus'}"></i>
          ${out ? 'Stok Habis' : 'Tambah ke Keranjang'}
        </button>
      </div>
    </div>`;

  $('#modal').hidden = false;
  document.body.style.overflow = 'hidden';

  const track = $('#pdTrack');
  const dotEls = $$('#pdDots .pd__dot');
  if (track && dotEls.length) {
    track.addEventListener('scroll', () => {
      const idx = Math.round(track.scrollLeft / track.clientWidth);
      dotEls.forEach((d, i) => d.classList.toggle('pd__dot--active', i === idx));
    }, { passive: true });
  }
}

function closeModal() {
  $('#modal').hidden = true;
  document.body.style.overflow = '';
}

/* ============ CART ============ */
function addToCart(id, qty = 1) {
  const p = state.products.find((x) => x.id === id);
  if (!p || p.stock <= 0) return showToast('Stok habis');

  const item = state.cart.find((x) => x.id === id);
  if (item) item.qty = Math.min(item.qty + qty, p.stock);
  else state.cart.push({
    id: p.id, name: p.name, price: p.price,
    image: p.images[0] || '', link: p.link, qty: Math.min(qty, p.stock),
  });

  saveCart();
  updateCartUI();
  showToast(`${p.name} ditambahkan`);
}

function changeQty(id, delta) {
  const item = state.cart.find((x) => x.id === id);
  const p = state.products.find((x) => x.id === id);
  if (!item) return;
  const max = p ? p.stock : 99;
  item.qty = Math.max(1, Math.min(item.qty + delta, max));
  saveCart();
  updateCartUI();
}

function removeItem(id) {
  state.cart = state.cart.filter((x) => x.id !== id);
  saveCart();
  updateCartUI();
  showToast('Item dihapus');
}

const cartCount = () => state.cart.reduce((s, i) => s + i.qty, 0);
const cartTotal = () => state.cart.reduce((s, i) => s + i.price * i.qty, 0);

function updateCartUI() {
  const count = cartCount();
  const badge = $('#cartBadge');
  badge.textContent = count;
  badge.hidden = count === 0;

  const navBadge = $('#navBadge');
  if (navBadge) { navBadge.textContent = count; navBadge.hidden = count === 0; }

  const body = $('#cartBody');
  const foot = $('#cartFoot');

  if (!state.cart.length) {
    body.innerHTML = `
      <div class="cart-empty">
        <div class="cart-empty__icon"><i class="fas fa-bag-shopping"></i></div>
        <p class="cart-empty__text">Keranjang masih kosong</p>
        <p class="cart-empty__hint">Yuk pilih produk dulu</p>
      </div>`;
    foot.hidden = true;
    return;
  }

  body.innerHTML = state.cart.map((i) => {
    const img = i.image ? renderImgTag(i.image, i.name) : `<div class="img-fallback"><i class="fas fa-image"></i></div>`;
    return `
      <div class="ci">
        <div class="ci__img">${img}</div>
        <div class="ci__info">
          <div class="ci__name">${esc(i.name)}</div>
          <div class="ci__price">${formatRp(i.price)}</div>
          <div class="ci__ctrls">
            <button class="ci__qty-btn" data-dec="${esc(i.id)}"><i class="fas fa-minus"></i></button>
            <span class="ci__qty">${i.qty}</span>
            <button class="ci__qty-btn" data-inc="${esc(i.id)}"><i class="fas fa-plus"></i></button>
            <button class="ci__remove" data-del="${esc(i.id)}">Hapus</button>
          </div>
        </div>
      </div>`;
  }).join('');

  $('#cartTotal').textContent = formatRp(cartTotal());
  foot.hidden = false;
}

/* ============ CHECKOUT ============ */
function checkout() {
  if (!state.cart.length) return showToast('Keranjang kosong');

  const lines = [`Halo *${CONFIG.STORE_NAME}*, saya mau pesan:`, ''];
  state.cart.forEach((i, idx) => {
    const sub = i.price * i.qty;
    lines.push(`${idx + 1}. *${i.name}*`);
    lines.push(`   ${i.qty} × ${formatRp(i.price)} = ${formatRp(sub)}`);
    if (i.link) lines.push(`   Link: ${i.link}`);
    lines.push('');
  });
  lines.push('━━━━━━━━━━━━━━━');
  lines.push(`*TOTAL: ${formatRp(cartTotal())}*`);
  lines.push('━━━━━━━━━━━━━━━');
  lines.push('');
  lines.push('Mohon konfirmasi pesanan saya. Terima kasih 🙏');

  const url = `https://wa.me/${CONFIG.WA_NUMBER}?text=${encodeURIComponent(lines.join('\n'))}`;
  window.open(url, '_blank');
}

/* ============ DRAWER ============ */
function openDrawer() {
  $('#drawer').hidden = false;
  document.body.style.overflow = 'hidden';
  updateCartUI();
}
function closeDrawer() {
  $('#drawer').hidden = true;
  document.body.style.overflow = '';
}

/* ============ BOTTOM NAV ============ */
function bindBottomNav() {
  $$('.nav-item').forEach((item) => {
    item.addEventListener('click', () => {
      const nav = item.dataset.nav;
      if (nav === 'cart') { openDrawer(); return; }
      if (nav === 'wa') {
        window.open(`https://wa.me/${CONFIG.WA_NUMBER}?text=${encodeURIComponent('Halo 4D Mart 👋')}`, '_blank');
        return;
      }
      if (nav === 'category') {
        $('#chips').scrollIntoView({ behavior:'smooth', block:'start' });
        return;
      }
      window.scrollTo({ top:0, behavior:'smooth' });
      $$('.nav-item').forEach((n) => n.classList.remove('nav-item--active'));
      item.classList.add('nav-item--active');
    });
  });
}

/* ============ EVENTS ============ */
function bind() {
  const appbar = $('#appbar');
  window.addEventListener('scroll', () => {
    appbar.classList.toggle('appbar--scrolled', window.scrollY > 8);
  }, { passive:true });

  const searchInput = $('#searchInput');
  const searchClear = $('#searchClear');
  searchInput.addEventListener('input', (e) => {
    state.query = e.target.value.trim();
    searchClear.hidden = !state.query;
    renderGrid();
  });
  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    state.query = '';
    searchClear.hidden = true;
    renderGrid();
    searchInput.focus();
  });

  $('#chips').addEventListener('click', (e) => {
    const c = e.target.closest('[data-cat]');
    if (!c) return;
    state.category = c.dataset.cat;
    renderChips();
    renderGrid();
  });

  $('#grid').addEventListener('click', (e) => {
    const addBtn = e.target.closest('[data-add]');
    if (addBtn) { e.stopPropagation(); addToCart(addBtn.dataset.add); return; }
    const card = e.target.closest('.card');
    if (card) openDetail(card.dataset.id);
  });

  $('#modalContent').addEventListener('click', (e) => {
    const addBtn = e.target.closest('[data-add]');
    if (addBtn) { addToCart(addBtn.dataset.add); closeModal(); }
  });

  $$('[data-close]').forEach((el) =>
    el.addEventListener('click', () => { closeModal(); closeDrawer(); })
  );

  $('#cartBtn').addEventListener('click', openDrawer);

  $('#cartBody').addEventListener('click', (e) => {
    const inc = e.target.closest('[data-inc]');
    const dec = e.target.closest('[data-dec]');
    const del = e.target.closest('[data-del]');
    if (inc) changeQty(inc.dataset.inc, +1);
    if (dec) changeQty(dec.dataset.dec, -1);
    if (del) removeItem(del.dataset.del);
  });

  $('#checkoutBtn').addEventListener('click', checkout);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeModal(); closeDrawer(); }
  });

  bindBottomNav();
}

/* ============ INIT ============ */
async function init() {
  renderSkeleton();
  try {
    state.products = await fetchProducts();
  } catch (e) {
    state.products = FALLBACK_PRODUCTS;
  }
  renderChips();
  renderGrid();
  updateCartUI();
  bind();
}

init();
</script>
</body>
</html>
